# ═══════════════════════════════════════════════════════════════════════════════
#  FakePlayerPlugin - Main Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file controls normal runtime behavior: bot limits, naming, persistence,
# physical body behavior, combat/damage settings, database storage, and metrics.
# Debug logging is configured separately in debug.yml.
#
# Do not edit config-version manually. It is used by the automatic config
# migrator to safely add new defaults during plugin upgrades.
# ═══════════════════════════════════════════════════════════════════════════════
config-version: 74
language: en

# ═══════════════════════════════════════════════════════════════════════════════
# SPAWN LIMITS
# ═══════════════════════════════════════════════════════════════════════════════
# max-bots: Global active bot cap. Set to 0 for unlimited.
# user-bot-limit: Default cap for players with user-spawn permission only.
# spawn-presets: Tab-complete suggestions for /fpp spawn amounts.
# spawn-cooldown: Seconds between spawn commands. Set to 0 to disable.
# ═══════════════════════════════════════════════════════════════════════════════
limits:
  max-bots: 1000
  user-bot-limit: 1
  spawn-presets: [1, 5, 10, 15, 20]

spawn-cooldown: 0

# ═══════════════════════════════════════════════════════════════════════════════
# ECONOMY / BOT RENTAL
# ═══════════════════════════════════════════════════════════════════════════════
# Lets players pay real economy currency to rent a bot for a set number of hours
# via /fpp rent buy <hours> - the bot auto-despawns when its time runs out.
# Disabled by default (a bot rented this way still counts toward the normal
# limits.max-bots / limits.user-bot-limit caps).
#
# provider: auto | vault | excellenteconomy | none
#   auto             - Vault if present (this also transparently covers "Vault2.0"
#                       and any Vault-bridged plugin, ExcellentEconomy included),
#                       else native ExcellentEconomy, else unavailable.
#   vault            - only ever use Vault's registered Economy service.
#   excellenteconomy - only ever use ExcellentEconomy's native API directly.
#   none             - economy features off; /fpp rent give (admin/console/shop-
#                       plugin grants) still works since it never touches money.
# excellent-economy-currency-id: which ExcellentEconomy currency to charge -
#   only used when the provider ends up being ExcellentEconomy (ExcellentEconomy
#   supports unlimited custom currencies, so there is no single fixed default;
#   this must match a currency id you've actually created in ExcellentEconomy).
#
# rental.price-per-hour: cost per hour of rented bot time.
# rental.price-per-bot-slot: one-time extra charge for a brand-new rented bot
#   (on top of price-per-hour x hours), separate from the per-hour time cost.
# rental.min-hours / max-hours: bounds enforced on a single /fpp rent buy/extend.
# rental.max-banked-hours: hard cap on remaining time a bot can bank across
#   repeated extensions, so a bot can't be pre-paid indefinitely far into the future.
# rental.warn-minutes-before-expiry: owner gets a one-time warning this many
#   minutes before a rented bot's time runs out (0 to disable).
# rental.sweep-interval-seconds: how often the expiry check runs.
# rental.max-bots-per-player: how many rented bots one player may have active at
#   once (fpp.rent.unlimited bypasses this).
# ═══════════════════════════════════════════════════════════════════════════════
economy:
  enabled: false
  provider: auto
  excellent-economy-currency-id: money
  rental:
    price-per-hour: 100.0
    price-per-bot-slot: 0.0
    min-hours: 1
    max-hours: 72
    max-banked-hours: 168
    warn-minutes-before-expiry: 10
    sweep-interval-seconds: 30
    max-bots-per-player: 3
    # Seconds a rented bot stays after its time ran out (a window to extend). 0 = despawn immediately.
    expiry-grace-seconds: 0
    # Bulk pricing: rent at least <hours> and get <percent> off (the larger of this and the
    # player's fpp.rent.discount.<n> permission applies; they do not stack).
    bulk-discounts:
      6: 5
      24: 15
      72: 25
    # Auto-renew (/fpp rent auto <bot> on [hours]): renewed this many minutes before expiry, charged
    # to the owner (works while they are offline with Vault).
    auto-renew-lead-minutes: 2
    auto-renew-hours: 1
    # Built-in rent GUI (/fpp rent, /fpp rent gui, and the main menu card).
    gui:
      enabled: true
    # Named offers. The rent GUI lists them, and ANY shop GUI plugin can sell one with the single
    # command  fpp rent package <id> --for <player>  (console / fpp.rent.give).
    #   hours: required, within min-hours..max-hours
    #   label / icon / description: how it looks in GUIs
    #   price: optional fixed price (replaces slot+hourly; discounts still apply)
    #   permission: optional extra node needed to buy it
    packages:
      hour:
        hours: 1
        label: "1 Hour"
        icon: CLOCK
        description: ["A quick shift."]
      half-day:
        hours: 12
        label: "12 Hours"
        icon: CLOCK
      day:
        hours: 24
        label: "1 Day"
        icon: CLOCK
        description: ["Best for overnight farms."]
      three-days:
        hours: 72
        label: "3 Days"
        icon: CLOCK
  spawn:
    # Price of a user-tier /fpp spawn (0 = free). Admins and fpp.spawn.free never pay.
    price: 0.0
  # Log every charge/refund to the console at INFO (audit trail) instead of debug only.
  log-transactions: false

# ═══════════════════════════════════════════════════════════════════════════════
# RESTART PERSISTENCE
# ═══════════════════════════════════════════════════════════════════════════════
# When enabled, active bots are saved and restored after server restart/reload.
# restore-delay-ticks can delay restoration until worlds/plugins finish loading.
# restore-batch-size controls how many bots are restored per batch.
# ═══════════════════════════════════════════════════════════════════════════════
persistence:
  enabled: true
  restore-delay-ticks: 0
  restore-batch-size: 1

# ═══════════════════════════════════════════════════════════════════════════════
# BOT NAMES
# ═══════════════════════════════════════════════════════════════════════════════
# Bots spawn with sequential internal names: bot, bot2, bot3, …
# admin-format controls the display name / name tag. Placeholder: {bot_name}
# ═══════════════════════════════════════════════════════════════════════════════
bot-name:
  admin-format: '{bot_name}'
  user-format: '{bot_name}'

# ═══════════════════════════════════════════════════════════════════════════════
# BOT NAME TAG (mannequin-style, three rows)
# ═══════════════════════════════════════════════════════════════════════════════
# All three rows are rendered by a floating text_display above the bot; the bot's
# vanilla over-head name is hidden so it does not overlay.
#   Row 1 (top)    = current activity (idle/moving/mining/fighting/searching/sneaking/...),
#                    computed live twice a second - not configurable here, see BotActivity.java.
#   Row 2 (middle) = the bot's name.
#   Row 3 (bottom) = the format below.
# Row 3 is a mandatory disclosure tag and cannot be disabled - every bot must
# always visibly identify itself as a bot.
#   {owner} = the player (or CONSOLE) that spawned the bot.
#   y-offset             = blocks above the bot's feet (~1.9 sits just above the head, mannequin-style).
#   interpolation-ticks  = follow smoothing; ~3 matches the bot's own movement.
#   background-opacity   = black plate behind each row, 0.0-1.0. 0.25 matches a vanilla name tag.
#   row-spacing          = blocks between the three stacked rows (each row has its own plate).
# ═══════════════════════════════════════════════════════════════════════════════
nametag:
  second-line:
    format: '<#BAFF4F>ʙᴏᴛ ʙʏ {owner}</#BAFF4F>'
    y-offset: 1.9
    interpolation-ticks: 3
    background-opacity: 0.25
    row-spacing: 0.3

# ═══════════════════════════════════════════════════════════════════════════════
# TAB LIST
# ═══════════════════════════════════════════════════════════════════════════════
# enabled: false (default) keeps bots out of the tab list entirely.
# When true, bots are listed - always and only as "[Bot] - <botname>" - so they can
# never pass for a real player. Toggle live in /fpp settings (body category).
# ═══════════════════════════════════════════════════════════════════════════════
tab-list:
  enabled: false

# ═══════════════════════════════════════════════════════════════════════════════
# BOT SKINS (rarity pools)
# ═══════════════════════════════════════════════════════════════════════════════
# Skins are defined in plugins/FakePlayerPlugin/skins/ as text files of NameMC
# skin URLs (https://namemc.com/skin/<id>), one per line:
#   main_skin.txt = the default skin every bot spawns with.
#   1-<N>%.txt    = a "1 in N" rarity pool - each fresh spawn has a 1/N chance to
#                   draw a random skin from that file instead of the main skin.
#                   Add or remove pool files freely; rarest pools roll first.
# Skins are signed once through the MineSkin API (slim/classic model detected
# automatically from the texture) and cached forever in data/skin-cache.yml.
# A bot keeps its rolled skin across despawn/restart; the roll only happens on a
# brand-new spawn. Set rare-pools: false to disable the whole system (bots then
# use the vanilla default Steve/Alex skin).
# ═══════════════════════════════════════════════════════════════════════════════
skin:
  rare-pools: true
  # Optional MineSkin API key (https://mineskin.org/apikey) - grants a much larger
  # signing quota than anonymous use. Only needed if you add many new skins at once.
  mineskin-api-key: ''

# ═══════════════════════════════════════════════════════════════════════════════
# BAD WORD FILTER
# ═══════════════════════════════════════════════════════════════════════════════
# Blocks or renames custom bot names before spawn.
# use-global-list downloads an external bad-word list at startup.
# auto-rename: true prefixes/sanitizes blocked names; false rejects them.
# auto-detection mode can be off, normal, or strict.
# ═══════════════════════════════════════════════════════════════════════════════
badword-filter:
  enabled: true
  use-global-list: false
  global-list-url: "https://www.cs.cmu.edu/~biglou/resources/bad-words.txt"
  global-list-timeout-ms: 5000
  words: []
  whitelist: []
  auto-rename: true
  auto-detection:
    enabled: true
    mode: normal

# ═══════════════════════════════════════════════════════════════════════════════
# PLAYER INTERACTION
# ═══════════════════════════════════════════════════════════════════════════════
# right-click-enabled lets players interact with bot inventories/settings.
# shift-right-click-settings opens the settings GUI when sneaking.
# ═══════════════════════════════════════════════════════════════════════════════
bot-interaction:
  right-click-enabled: true
  shift-right-click-settings: true

# ═══════════════════════════════════════════════════════════════════════════════
# MESSAGES
# ═══════════════════════════════════════════════════════════════════════════════
# Bots never produce chat events: no join, leave, death, kill or advancement messages.
# notify-admins-on-join sends a compatibility notification to staff/admin users (real players).
# ═══════════════════════════════════════════════════════════════════════════════
messages:
  notify-admins-on-join: true

# ═══════════════════════════════════════════════════════════════════════════════
# PHYSICAL BOT BODY
# ═══════════════════════════════════════════════════════════════════════════════
# pushable controls collision/knockback behavior.
# damageable false cancels player/entity damage to bot bodies.
# drop-items-on-despawn false preserves inventory/XP for later respawn/restore.
# auto-mount true lets boats/minecarts pick bots up when they run into them.
# ═══════════════════════════════════════════════════════════════════════════════
body:
  pushable: true
  damageable: true
  pick-up-items: true
  pick-up-xp: true
  # auto-mount: boats and moving minecarts that run into a bot pick it up, like vanilla mobs
  # (villagers etc.). Bots dismounted by command/sneak are not re-boarded for 3 seconds.
  auto-mount: true
  drop-items-on-despawn: false

# ═══════════════════════════════════════════════════════════════════════════════
# COMBAT AND DAMAGE
# ═══════════════════════════════════════════════════════════════════════════════
# max-health is vanilla player health by default: 20.0 = 10 hearts.
# hurt-sound controls player hurt audio for bot bodies.
# fall-damage follows vanilla-style safe distance and multiplier behavior.
# ═══════════════════════════════════════════════════════════════════════════════
combat:
  max-health: 20.0
  hurt-sound: true
  fall-damage:
    enabled: true
    safe-distance: 3.0
    multiplier: 1.0

# ═══════════════════════════════════════════════════════════════════════════════
# DEATH BEHAVIOR
# ═══════════════════════════════════════════════════════════════════════════════
# respawn-on-death respawns bots automatically after death.
# respawn-delay is measured in ticks. 20 ticks = 1 second.
# suppress-drops clears drops/XP from bot death events.
# ═══════════════════════════════════════════════════════════════════════════════
death:
  respawn-on-death: false
  respawn-delay: 1
  suppress-drops: false

# ═══════════════════════════════════════════════════════════════════════════════
# CHUNK LOADING
# ═══════════════════════════════════════════════════════════════════════════════
# A bot behaves like an AFK player: the server's own chunk system loads, generates
# and ticks the area around where it stands. The plugin does NOT hold chunk tickets
# or change any server setting - the bot only reports a render distance, exactly
# like the video-settings slider of a real client (see also `bot-client` below).
#
# view-distance: render distance each bot reports, in chunks.
#   "auto" = the server's view distance. 0 = the vanilla minimum (2).
#   Real loading/ticking range is still set by the server's own view/simulation
#   distance; this value mainly bounds what the "client" is sent.
#   Per-bot override: the bot settings GUI (-1 = follow this value).
# update-interval: ticks between re-syncing each bot's options.
# mass-disable-threshold: at this many active bots, every bot drops to
#   mass-view-distance (0 disables the protection).
# ═══════════════════════════════════════════════════════════════════════════════
chunk-loading:
  enabled: true
  view-distance: "auto"
  update-interval: 20
  mass-disable-threshold: 100
  mass-view-distance: 3

# ═══════════════════════════════════════════════════════════════════════════════
# BOT CLIENT OPTIONS
# ═══════════════════════════════════════════════════════════════════════════════
# What each bot tells the server about its "client" - the in-game options menu.
# language: locale code (en_us, de_de, ...)
# main-hand: right | left
# skin-parts: all | none | bitmask 0-127 (cape 1, jacket 2, sleeves 4+8, pants 16+32, hat 64)
# particles: all | decreased | minimal
# chat-visibility: full | system | hidden
# allow-server-listings: whether the bot may appear in server-list player samples
# ═══════════════════════════════════════════════════════════════════════════════
bot-client:
  language: "en_us"
  main-hand: right
  skin-parts: all
  particles: all
  chat-visibility: full
  allow-server-listings: false

# ═══════════════════════════════════════════════════════════════════════════════
# BOT AUTOMATION DEFAULTS
# ═══════════════════════════════════════════════════════════════════════════════
# These defaults are copied to newly spawned/restored bots.
# ═══════════════════════════════════════════════════════════════════════════════
automation:
  auto-eat: true
  # Default hunger level (0-19) at or below which a bot eats. Per-bot overridable in the settings GUI.
  auto-eat-threshold: 17
  auto-place-bed: true
  auto-milk: true
  prevent-bad-omen: true

# ═══════════════════════════════════════════════════════════════════════════════
# HEAD AI
# ═══════════════════════════════════════════════════════════════════════════════
# Makes bots look at nearby players/entities.
# turn-speed: 0.0 = frozen, 1.0 = instant snap.
# tick-rate is the scan interval in server ticks.
# ═══════════════════════════════════════════════════════════════════════════════
head-ai:
  enabled: true
  look-range: 8.0
  turn-speed: 0.3
  tick-rate: 3

# ═══════════════════════════════════════════════════════════════════════════════
# SWIM AI
# ═══════════════════════════════════════════════════════════════════════════════
# Lets bots attempt basic swimming/surface movement when physics places them in
# water. Land navigation is handled by the pathfinding engine.
# ═══════════════════════════════════════════════════════════════════════════════
swim-ai:
  enabled: true

# ═══════════════════════════════════════════════════════════════════════════════
# COLLISION AND KNOCKBACK
# ═══════════════════════════════════════════════════════════════════════════════
# walk-* controls player walking collision impulses.
# hit-* controls attack knockback impulses.
# bot-* controls bot-to-bot separation.
# max-horizontal-speed caps collision velocity so bots do not launch too far.
# ═══════════════════════════════════════════════════════════════════════════════
collision:
  walk-radius: 0.85
  walk-strength: 0.22
  hit-strength: 0.45
  hit-max-horizontal-speed: 0.80
  bot-radius: 0.90
  bot-strength: 0.14
  max-horizontal-speed: 0.30

# ═══════════════════════════════════════════════════════════════════════════════
# DATABASE
# ═══════════════════════════════════════════════════════════════════════════════
# mode LOCAL is for one server. NETWORK is for shared MySQL/proxy setups.
# server-id must be unique per backend server when using NETWORK mode.
# location-flush-interval controls how often live positions are written.
# ═══════════════════════════════════════════════════════════════════════════════
database:
  enabled: true
  mode: "LOCAL"
  server-id: "default"
  mysql-enabled: false
  mysql:
    host: "localhost"
    port: 3306
    database: "fpp"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 5
    connection-timeout: 30000
  location-flush-interval: 30
  session-history:
    max-rows: 20

# ═══════════════════════════════════════════════════════════════════════════════
# CONFIG SYNC
# ═══════════════════════════════════════════════════════════════════════════════
# DISABLED: no sync. MANUAL: command-driven sync only.
# AUTO_PULL/AUTO_PUSH are for coordinated multi-server setups.
# ═══════════════════════════════════════════════════════════════════════════════
config-sync:
  mode: "DISABLED"

# ═══════════════════════════════════════════════════════════════════════════════
# AUTH  (register/login against an installed login plugin, e.g. nLogin, AuthMe, LoginSecurity)
# ═══════════════════════════════════════════════════════════════════════════════
# When enabled, every bot plays along with a login-wall plugin instead of sitting there
# unauthenticated: it generates a password, registers on its first join, and remembers that
# password (encrypted, see auth.key in the plugin data folder) so every later join sends /login
# with that same remembered password instead of registering again. Needs database.enabled: true.
auth:
  enabled: false
  # Sent as the bot itself, exactly as if it were typed in chat (no leading slash needed).
  # %password% is replaced with the bot's own generated/remembered password. The defaults below
  # already match nLogin, AuthMe, LoginSecurity, CrazyLogin, and xAuth - only change these if your
  # login plugin uses different command syntax.
  register-command: "register %password% %password%"
  login-command: "login %password%"
  # Random delay before the command is sent, so it doesn't fire the instant a bot's connection
  # opens - mimics the time a real player takes to see the prompt and type their password.
  delay-min-ticks: 20 # 1s
  delay-max-ticks: 60 # 3s
  # A bot stands still and doesn't turn its head from the moment it joins until its register/login
  # outcome is known - the same restriction a real not-yet-authenticated player is usually under.
  # Cleared the instant its response looks like a success ("logged in", "registered", ...) or a
  # clear failure is logged, but this is always the hard fallback: if neither can be read/matched
  # (a differently-worded or non-English response), the bot is released anyway once this many
  # ticks pass so it never gets stuck frozen forever over a message this plugin failed to parse.
  pending-timeout-ticks: 100 # 5s
  # A generated password that's too LONG silently fails on plugins with a max-length policy
  # (OpeNLogin defaults to a 15-character cap, for example) - and since that rejection is often
  # shown through a title/UI element this plugin can't always read (see the note on
  # pending-timeout-ticks above), it can look like nothing happened at all rather than an obvious
  # error. 12 stays comfortably under every common auth plugin's default max; raise it only after
  # checking your specific login plugin's own password-length limit.
  password:
    length: 12
    uppercase: true
    lowercase: true
    digits: true
    symbols: true

# ═══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE
# ═══════════════════════════════════════════════════════════════════════════════
# position-sync-distance limits visual position sync range in blocks.
# Set to 0 to sync bot positions to all online players.
# ═══════════════════════════════════════════════════════════════════════════════
performance:
  enabled: true
  spark-enabled: true
  placeholders: true
  sample-interval-ticks: 20
  history-minutes: 15
  warn-mspt: 60.0
  warn-tps: 18.0
  warn-consecutive-samples: 3
  warn-cooldown-minutes: 5
  auto-profiler-timeout-seconds: 60
  self-profiler:
    enabled: false
    method-level: false
    export-on-warning: true
  position-sync-distance: 128.0

# ═══════════════════════════════════════════════════════════════════════════════
# UPDATE CHECKER
# ═══════════════════════════════════════════════════════════════════════════════
# Checks for plugin updates asynchronously. Disable if your server blocks
# outbound update-check requests or you manage updates externally.
# ═══════════════════════════════════════════════════════════════════════════════
update-checker:
  enabled: true
  # auto-update: when a newer release exists on Modrinth
  # (https://modrinth.com/plugin/fake-player-plugin-fpp) it is downloaded into
  # plugins/update/ under this jar's own file name, checked against Modrinth's
  # SHA-512, and installed by the server on its next restart. Nothing is replaced
  # while the server is running. On by default - set to false to only be notified.
  auto-update: true

# ═══════════════════════════════════════════════════════════════════════════════
# CLICK AUTOMATION
# ═══════════════════════════════════════════════════════════════════════════════
# Server-wide default pacing for held /fpp left-click and /fpp right-click
# (--repeat/--hold). Each bot can override its own interval in the per-bot
# settings GUI (⚙ ɢᴇɴᴇʀᴀʟ → ʟᴇꜰᴛ/ʀɪɢʜᴛ-ᴄʟɪᴄᴋ ɪɴᴛᴇʀᴠᴀʟ); these are only the
# fallback for bots that haven't been given their own value.
#
# left-click.interval-ticks: ticks between block breaks while REPEAT/HOLD
#   mining (vanilla's own destroyDelay is ~5 ticks; default matches that).
#   Entity attacks are unaffected - those are paced solely by the held
#   weapon's real attack-speed cooldown, exactly like a real player.
# left-click.auto-tool-switch: before mining a block, swap to the best
#   available tool (highest tier of the right category) already in the
#   bot's inventory - the way a competent player would before swinging.
# right-click.interval-ticks: ticks between held right-click pulses
#   (default 4 matches the vanilla client's own rightClickDelay).
# Both accept 1-40 ticks (enforced per-bot too).
# ═══════════════════════════════════════════════════════════════════════════════
left-click:
  interval-ticks: 4
  auto-tool-switch: true

right-click:
  interval-ticks: 4

# ═══════════════════════════════════════════════════════════════════════════════
# PVE DEFAULTS
# ═══════════════════════════════════════════════════════════════════════════════
# Default range/priority applied to a bot's PVE settings until changed in the
# per-bot settings GUI. Core /fpp attack itself is swing-only.
# ═══════════════════════════════════════════════════════════════════════════════
attack-mob:
  default-range: 8.0
  default-priority: nearest
  # Mode of a bare "/fpp attack <bot>": stand (hold position - AFK farms) or chase (hunt through pathfinding).
  default-mode: stand
  # Swap to the best melee weapon in the inventory when a fight starts.
  auto-weapon: true
  # Jump and strike while falling for critical hits (slower, higher damage per hit).
  criticals: false
  # Only attack targets the bot can see - a client cannot hit through walls.
  line-of-sight: true
  # Chase mode: after the fight, walk back to where the bot started.
  return-to-post: true
  return-delay-ticks: 60
  scan-interval-ticks: 5
  # Never auto-target tamed pets or villagers unless they are named explicitly.
  spare-friendlies: true

# ═══════════════════════════════════════════════════════════════════════════════
# CLEAR (/fpp clear)
# ═══════════════════════════════════════════════════════════════════════════════
# max-cells: largest region (blocks) one job may cover.
# progress-every-layers: tell the starter every N finished layers.
# default-trash: what a bare `--trash` discards when the inventory fills (empty = built-in list).
# ═══════════════════════════════════════════════════════════════════════════════
clear:
  max-cells: 2000000
  progress-every-layers: 8
  default-trash: []

# ═══════════════════════════════════════════════════════════════════════════════
# SPAWN ACTIONS
# ═══════════════════════════════════════════════════════════════════════════════
# /fpp spawn [--name N] [--count N] [--location x y z world] [--delay 5s]
#            [--preset P] <action> [args] [then|wait 5s <action> ...]
# Actions run once, as the spawner (their permissions apply), when the bot is online.
# Built-in actions: attack move find left-click right-click storage sneak freeze.
# Any other registered command whose usage starts with <bot> also works.
# Placeholders in action arguments: {bot} {owner} {x} {y} {z} {world} {index}
# Durations: 10t = ticks, 5s = seconds, 2m = minutes (a bare number = seconds).
# initial-delay-ticks: pause between "online" and the first action.
# extra-commands / blocked-commands: widen or restrict the usable action names.
# allow-run: let admins use `run <command...>` as an action (raw command line).
# presets: reusable action strings, used as `--preset guard` or `preset guard`.
# ═══════════════════════════════════════════════════════════════════════════════
spawn-actions:
  enabled: true
  initial-delay-ticks: 10
  max-count: 10
  extra-commands: []
  blocked-commands: []
  allow-run: true
  presets:
    guard: "attack --stand"
    hunter: "attack --chase --range 16"
    farmer-guard: "attack --stand --range 6 --priority lowest-health"
    miner: "left-click --hold"
    clicker: "right-click --repeat"

# ═══════════════════════════════════════════════════════════════════════════════
# METRICS
# ═══════════════════════════════════════════════════════════════════════════════
# Sends anonymous usage statistics if enabled.
# ═══════════════════════════════════════════════════════════════════════════════
metrics:
  enabled: true
