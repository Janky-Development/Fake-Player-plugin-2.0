spawn-max-reached:        "{prefix}<#FF6A5C>ᴍᴀx ʙᴏᴛ ʟɪᴍɪᴛ ʀᴇᴀᴄʜᴇᴅ <#5F5B73>(<#A78BFA>{max}</#A78BFA> <#9691AB>ʙᴏᴛꜱ<#5F5B73>)<#FF6A5C>. ᴅᴇʟᴇᴛᴇ ꜱᴏᴍᴇ ꜰɪʀꜱᴛ."
spawn-user-limit-reached: "{prefix}<#FF6A5C>ʏᴏᴜ'ᴠᴇ ʀᴇᴀᴄʜᴇᴅ ʏᴏᴜʀ ᴘᴇʀꜱᴏɴᴀʟ ʙᴏᴛ ʟɪᴍɪᴛ <#5F5B73>(<#A78BFA>{limit}</#A78BFA> <#9691AB>ʙᴏᴛ(ꜱ)<#5F5B73>)<#FF6A5C>."
spawn-no-names-left:      "{prefix}<#FF6A5C>ᴀʟʟ ɴᴀᴍᴇꜱ ɪɴ ᴛʜᴇ ᴘᴏᴏʟ ᴀʀᴇ ɪɴ ᴜꜱᴇ. <#9691AB>ʀᴇᴅᴜᴄᴇ ᴀᴄᴛɪᴠᴇ ʙᴏᴛꜱ ᴏʀ ᴀᴅᴅ ᴍᴏʀᴇ ɴᴀᴍᴇꜱ."
# {name} - the rejected custom name (--name flag)
spawn-invalid-name:       "{prefix}<#FF6A5C>'<#EEECF7>{name}</#EEECF7><#FF6A5C>' ɪꜱ ɴᴏᴛ ᴀ ᴠᴀʟɪᴅ ʙᴏᴛ ɴᴀᴍᴇ <#5F5B73>(1-16 ʟᴇᴛᴛᴇʀꜱ, ɴᴜᴍʙᴇʀꜱ, ᴜɴᴅᴇʀꜱᴄᴏʀᴇꜱ)<#FF6A5C>."
spawn-name-taken:         "{prefix}<#FF6A5C>ᴀ ʙᴏᴛ ɴᴀᴍᴇᴅ '<#EEECF7>{name}</#EEECF7><#FF6A5C>' ᴀʟʀᴇᴀᴅʏ ᴇxɪꜱᴛꜱ."
spawn-name-online:        "{prefix}<#FF6A5C>ᴀ ʀᴇᴀʟ ᴘʟᴀʏᴇʀ ɴᴀᴍᴇᴅ '<#EEECF7>{name}</#EEECF7><#FF6A5C>' ɪꜱ ᴏɴʟɪɴᴇ - ᴘɪᴄᴋ ᴀɴᴏᴛʜᴇʀ ɴᴀᴍᴇ."
spawn-invalid-location:   "{prefix}<#FF6A5C>ᴜꜱᴀɢᴇ: <#EEECF7>--location <x> <y> <z> <world></#EEECF7>."
# {world} - the world name passed to --location that doesn't exist
spawn-world-not-found:    "{prefix}<#FF6A5C>ᴡᴏʀʟᴅ '<#EEECF7>{world}</#EEECF7><#FF6A5C>' ᴡᴀꜱ ɴᴏᴛ ꜰᴏᴜɴᴅ."
# {name} - bot name  |  {rarity} - e.g. 1/5000; sent to the spawner when a rare pool skin is rolled
skin-rare-rolled:         "{prefix}<#BAFF4F>✨ <#A78BFA>{name}</#A78BFA> <#BAFF4F>ꜱᴘᴀᴡɴᴇᴅ ᴡɪᴛʜ ᴀ ʀᴀʀᴇ ꜱᴋɪɴ! <#5F5B73>(<#EEECF7>{rarity}</#EEECF7> ᴄʜᴀɴᴄᴇ<#5F5B73>)"

player-not-found:   "{prefix}<#FF6A5C>ᴘʟᴀʏᴇʀ <#EEECF7>{player} <#FF6A5C>ɪꜱ ɴᴏᴛ ᴏɴʟɪɴᴇ."

# ── Spawn cooldown ─────────────────────────────────────────────────────────────
# {seconds} - seconds remaining
spawn-cooldown: "{prefix}<#FF6A5C>ᴘʟᴇᴀꜱᴇ ᴡᴀɪᴛ <#EEECF7>{seconds}s<#FF6A5C> ʙᴇꜰᴏʀᴇ ꜱᴘᴀᴡɴɪɴɢ ᴀɢᴀɪɴ."


