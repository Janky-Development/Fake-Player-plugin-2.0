# Horizontal rule used in headers and footers
divider: "<#2A2735><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st>"

# Help menu  (placeholders {cmd}, {args}, {desc} required)
help-header: "<#2A2735><st>━━━━━━━━━</st> <#A78BFA><bold>ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ</#A78BFA> <#2A2735><st>━━━━━━━━━</st>"
help-entry:  "  <#A78BFA>/{cmd}</#A78BFA><#9691AB> {args} <#5F5B73>- <#EEECF7>{desc}"
help-footer: "<#2A2735><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st>"

