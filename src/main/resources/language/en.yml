delete-all:            "{prefix}<#A78BFA>{count}</#A78BFA> <#9691AB>ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ(ꜱ) <#EEECF7>ᴅɪꜱᴄᴏɴɴᴇᴄᴛᴇᴅ<#9691AB>."
