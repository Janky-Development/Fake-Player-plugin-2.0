bot-died-despawned:    "{prefix}<#A78BFA>{name}</#A78BFA> <#9691AB>ᴅɪᴇᴅ ᴀɴᴅ ᴡᴀꜱ <#EEECF7>ʀᴇᴍᴏᴠᴇᴅ<#9691AB> <#5F5B73>(ʀᴇꜱᴘᴀᴡɴ ᴏɴ ᴅᴇᴀᴛʜ ɪꜱ ᴏꜰꜰ)<#9691AB>."


