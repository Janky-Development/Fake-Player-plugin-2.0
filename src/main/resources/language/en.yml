# ─────────────────────────────────────────────────────────────────────────────
#  ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ  ·  language/en.yml
#  Edit freely and run /fpp reload to apply changes without restarting.
#
#  Colour format: MiniMessage hex tags, e.g. <#A78BFA>text</#A78BFA>
#  Style          : <bold>, <italic>, <underlined>, <strikethrough>
#  Reset          : <reset>
#
#  ── FPP 2.0 "Bot Console" palette ──────────────────────────────────────────
#    #A78BFA  violet       primary accent - bot names, numbers, headings, links
#    #CABAFF  violet-soft  lighter violet - command / flag syntax
#    #BAFF4F  lime         secondary accent - success, warnings, highlights
#    #FF6A5C  red          errors (used sparingly)
#    #EEECF7  ink          emphasised values / primary text
#    #9691AB  mute         body copy / secondary text
#    #5F5B73  mute-2       fine print, captions, punctuation
#    #2A2735  line         borders / dividers / rule characters
#
#  Placeholders: {placeholder} - see each section for available ones
#
#  ⚠  Keys marked "INTERNAL" are used by the layout engine.
#     You may adjust colours/characters but keep the key names intact.
# ─────────────────────────────────────────────────────────────────────────────

# ── Plugin prefix - prepended to all [FPP] messages ──────────────────────────
#  Feel free to change the colour/text, but keep it short.
prefix: "<#2A2735>[<#A78BFA>ꜰᴘᴘ</#A78BFA><#2A2735>]<reset> "


