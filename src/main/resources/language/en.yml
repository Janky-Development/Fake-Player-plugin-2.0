delete-not-found:      "{prefix}<#FF6A5C>ɴᴏ ᴀᴄᴛɪᴠᴇ ʙᴏᴛ ɴᴀᴍᴇᴅ <#EEECF7>{name}<#FF6A5C> ᴡᴀꜱ ꜰᴏᴜɴᴅ."
# {count} - number of bots randomly despawned
delete-random-success: "{prefix}<#A78BFA>{count}</#A78BFA> <#9691AB>ʀᴀɴᴅᴏᴍ ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ(ꜱ) <#EEECF7>ᴅɪꜱᴄᴏɴɴᴇᴄᴛᴇᴅ<#9691AB>."
# {count} - number of bots despawned in order (oldest first)
delete-num-success:    "{prefix}<#A78BFA>{count}</#A78BFA> <#9691AB>ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ(ꜱ) <#EEECF7>ᴅɪꜱᴄᴏɴɴᴇᴄᴛᴇᴅ<#9691AB>."
# {count} - number of bots despawned that belong to the sender
delete-own-success:    "{prefix}<#A78BFA>{count}</#A78BFA> <#9691AB>ʏᴏᴜʀ ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ(ꜱ) <#EEECF7>ᴅɪꜱᴄᴏɴɴᴇᴄᴛᴇᴅ<#9691AB>."
despawn-num-usage:     "{prefix}<#FF6A5C>ᴜꜱᴀɢᴇ: <#EEECF7>/fpp despawn --num <num></#EEECF7>."
