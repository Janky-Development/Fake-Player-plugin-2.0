name: FakePlayerPlugin
version: '2.1.0'
main: me.bill.fakePlayerPlugin.FakePlayerPlugin
api-version: '1.21'
folia-supported: true
authors: [ F_PP ]
description: "Advanced fake player / bot plugin for Paper and Folia 1.21+"
website: "https://modrinth.com/plugin/fake-player-plugin-fpp"
softdepend: [ PlaceholderAPI, WorldEdit, spark, Vault, ExcellentEconomy ]

commands:
  fpp:
    description: Fake Player Plugin main command
    usage: /fpp [sub-command]
    aliases: [ fakeplayer, fp ]
    permission-message: ''

# ══════════════════════════════════════════════════════════════════════════════
#                           PERMISSION SYSTEM  v1.6.5
# ══════════════════════════════════════════════════════════════════════════════
#
# STRUCTURE:  fpp.<command>[.<action>][.<scope>]
#   <command>  main command  (spawn, move, left-click …)
#   <action>   specific sub-behaviour  (set, start, once, stop …)
#   <scope>    ownership tier  (own, others, bulk, all)
#
# TIERS:
#   fpp.admin / fpp.op   → FULL access  (identical - both work)
#   fpp.use              → USER access  (default: everyone)
#   individual nodes     → fine-grained control
#
# QUICK SETUP:
#   Grant full admin:    /lp group admin  permission set fpp.admin true
#   Grant user access:   /lp group member permission set fpp.use   true
#   Set bot limit (5):   /lp user Alice   permission set fpp.spawn.limit.5 true
#   Bypass cooldown:     /lp user VIP     permission set fpp.bypass.cooldown true
#   Negate /fpp command: /lp group guest  permission set fpp.command false
#
# LEGACY NODES (still fully supported - no migration required):
#   fpp.op           →  still works, identical to fpp.admin
#   fpp.delete       →  still works, identical to fpp.despawn
#   fpp.delete.all   →  still works, identical to fpp.despawn.bulk
#   fpp.useitem      →  still works, identical to fpp.use.cmd
# ══════════════════════════════════════════════════════════════════════════════

permissions:

  # ════════════════════════════════════════════════════════════════════════════
  #  WILDCARD TIERS
  # ════════════════════════════════════════════════════════════════════════════

  fpp.admin:
    description: >
      Full access to all FPP commands and features. New preferred name -
      equivalent to fpp.op. Assign to owner / admin groups only.
    default: op
    children:
      fpp.op:                   true

  fpp.op:
    description: >
      Full access to all FPP commands (legacy admin wildcard).
      fpp.admin is the new preferred name - both are identical in effect.
    default: op
    children:
      fpp.command:              true
      fpp.plugininfo:           true
      fpp.help:                 true
      fpp.spawn:                true
      fpp.despawn:              true
      fpp.despawn.bulk:         true
      fpp.despawn.own:          true
      fpp.delete:               true
      fpp.delete.all:           true
      fpp.list:                 true
      fpp.reload:               true
      fpp.info:                 true
      fpp.tp:                   true
      fpp.tph:                  true
      fpp.tph.all:              true
      fpp.xp:                   true
      fpp.bypass.max:           true
      fpp.bypass.cooldown:      true
      fpp.freeze:               true
      fpp.sneak:                true
      fpp.rename:               true
      fpp.settings:             true
      fpp.check:                true
      fpp.move:                 true
      fpp.move.to:              true
      fpp.move.coords:          true
      fpp.inventory:            true
      fpp.inventory.cmd:        true
      fpp.inventory.rightclick: true
      fpp.left-click:           true
      fpp.left-click.start:     true
      fpp.left-click.once:      true
      fpp.left-click.repeat:    true
      fpp.left-click.hold:      true
      fpp.left-click.stop:      true
      fpp.right-click:          true
      fpp.right-click.start:    true
      fpp.right-click.once:     true
      fpp.right-click.repeat:   true
      fpp.right-click.hold:     true
      fpp.right-click.stop:     true
      fpp.perf:                 true
      fpp.storage:              true
      fpp.setowner:             true
      fpp.save:                 true
      fpp.useitem:              true
      fpp.use.cmd:              true
      fpp.useitem.start:        true
      fpp.useitem.once:         true
      fpp.useitem.stop:         true
      fpp.attack:               true
      fpp.find:                 true
      fpp.stop:                 true
      fpp.notify:               true
      fpp.use:                  true
      fpp.rent:                 true
      fpp.rent.info:            true
      fpp.rent.give:            true
      fpp.rent.unlimited:       true
      fpp.auth:                 true

  fpp.use:
    description: >
      User-tier access: /fpp spawn (1 bot), /fpp tph, /fpp xp, /fpp info (own).
      Default: everyone. Negate for specific groups: /lp group guest permission set fpp.use false
    default: true
    children:
      fpp.command:              true
      fpp.help:                 true
      fpp.spawn.user:           true
      fpp.tph:                  true
      fpp.xp:                   true
      fpp.info.user:            true
      fpp.spawn.limit.1:        true
      fpp.left-click.once:      true
      fpp.left-click.stop:      true
      fpp.right-click.once:     true
      fpp.right-click.stop:     true
      fpp.rent:                 true
      fpp.rent.info:            true

  # ════════════════════════════════════════════════════════════════════════════
  #  VISIBILITY
  # ════════════════════════════════════════════════════════════════════════════

  fpp.command:
    description: >
      Makes /fpp visible and usable (tab-complete, all sub-commands).
      Default: everyone. Negate to hide /fpp entirely from a group.
    default: true

  fpp.plugininfo:
    description: >
      Show full info panel on bare /fpp (version, author, active bots, links).
      Players without this see a minimal help hint instead. Default: op.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  SPAWN
  # ════════════════════════════════════════════════════════════════════════════

  fpp.spawn:
    description: >
      Admin spawn - ignores personal bot limits. Spawns one bot per command
      (auto-named or --name) at the commanding player's own location.
    default: op

  fpp.spawn.user:
    description: >
      Spawn bots up to the player's personal limit (fpp.spawn.limit.<n>) at
      your own location. Included in fpp.use.
    default: true

  # ── Bot limits ──────────────────────────────────────────────────────────────
  # Assign the highest node the player should be allowed.
  # fpp.spawn.limit.1 is included in fpp.use (default for all players).
  fpp.spawn.limit.1:
    description: Personal bot limit - 1 bot. Included in fpp.use.
    default: false
  fpp.spawn.limit.2:
    description: Personal bot limit - 2 bots.
    default: false
  fpp.spawn.limit.3:
    description: Personal bot limit - 3 bots.
    default: false
  fpp.spawn.limit.4:
    description: Personal bot limit - 4 bots.
    default: false
  fpp.spawn.limit.5:
    description: Personal bot limit - 5 bots.
    default: false
  fpp.spawn.limit.6:
    description: Personal bot limit - 6 bots.
    default: false
  fpp.spawn.limit.7:
    description: Personal bot limit - 7 bots.
    default: false
  fpp.spawn.limit.8:
    description: Personal bot limit - 8 bots.
    default: false
  fpp.spawn.limit.9:
    description: Personal bot limit - 9 bots.
    default: false
  fpp.spawn.limit.10:
    description: Personal bot limit - 10 bots.
    default: false
  fpp.spawn.limit.15:
    description: Personal bot limit - 15 bots.
    default: false
  fpp.spawn.limit.20:
    description: Personal bot limit - 20 bots.
    default: false
  fpp.spawn.limit.25:
    description: Personal bot limit - 25 bots.
    default: false
  fpp.spawn.limit.30:
    description: Personal bot limit - 30 bots.
    default: false
  fpp.spawn.limit.40:
    description: Personal bot limit - 40 bots.
    default: false
  fpp.spawn.limit.50:
    description: Personal bot limit - 50 bots.
    default: false
  fpp.spawn.limit.75:
    description: Personal bot limit - 75 bots.
    default: false
  fpp.spawn.limit.100:
    description: Personal bot limit - 100 bots.
    default: false

  # ════════════════════════════════════════════════════════════════════════════
  #  DESPAWN  (fpp.despawn = new name;  fpp.delete = legacy alias)
  # ════════════════════════════════════════════════════════════════════════════

  fpp.despawn:
    description: >
      Despawn bots - new preferred node. Grants fpp.delete, fpp.delete.all,
      fpp.despawn.bulk, fpp.despawn.own automatically.
    default: op
    children:
      fpp.delete:         true
      fpp.delete.all:     true
      fpp.despawn.bulk:   true
      fpp.despawn.own:    true

  fpp.delete:
    description: >
      Despawn fake players - legacy node (still fully supported).
      Prefer fpp.despawn for new setups.
    default: op
    children:
      fpp.delete.all: true

  fpp.delete.all:
    description: Despawn ALL bots at once (/fpp despawn all). Legacy node.
    default: op

  fpp.despawn.bulk:
    description: >
      New alias for fpp.delete.all - despawn multiple bots at once
      (--count, --random --count). Grants fpp.delete.all.
    default: op
    children:
      fpp.delete.all: true

  fpp.despawn.own:
    description: Despawn only bots the sender personally spawned.
    default: false

  # ════════════════════════════════════════════════════════════════════════════
  #  HELP / LIST / STATS
  # ════════════════════════════════════════════════════════════════════════════

  fpp.help:
    description: View /fpp help menu. Granted to everyone via fpp.use.
    default: true

  fpp.list:
    description: List all active bots with /fpp list.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  INFO
  # ════════════════════════════════════════════════════════════════════════════

  fpp.info:
    description: >
      Full admin database query - session history, timestamps, all bots.
    default: op

  fpp.info.user:
    description: >
      User info - own bots only (world, coordinates, uptime). In fpp.use.
    default: true

  # ════════════════════════════════════════════════════════════════════════════
  #  TELEPORT
  # ════════════════════════════════════════════════════════════════════════════

  fpp.tp:
    description: Teleport yourself to any active bot. Admin.
    default: op

  fpp.tph:
    description: Teleport your own bot(s) to you. Included in fpp.use.
    default: true

  fpp.tph.all:
    description: Teleport all accessible bots to you with /fpp tph all.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  XP
  # ════════════════════════════════════════════════════════════════════════════

  fpp.xp:
    description: Collect XP from your own bots. Included in fpp.use.
    default: true

  # ════════════════════════════════════════════════════════════════════════════
  #  MOVE
  # ════════════════════════════════════════════════════════════════════════════

  fpp.move:
    description: >
      Bot movement: pathfind to another bot/player or to fixed coordinates
      (requires fpp.move.to / fpp.move.coords below).
    default: op

  fpp.move.to:
    description: >
      Walk a bot to another bot's or online player's location via pathfinding, following live
      (/fpp move <bot|--all> --to <bot|player>).
    default: op

  fpp.move.coords:
    description: >
      Walk a bot to specific coordinates via pathfinding (/fpp move <bot|--all> --coords <x> <y> <z> [world]).
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  FREEZE
  # ════════════════════════════════════════════════════════════════════════════

  fpp.freeze:
    description: Freeze / unfreeze bots with /fpp freeze <bot|all> [on|off].
    default: op

  fpp.sneak:
    description: Toggle bot sneaking with /fpp sneak <bot> [on|off|toggle].
    default: op

  fpp.rename:
    description: Rename a bot's display name with /fpp rename <bot> <new name>.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  INVENTORY
  # ════════════════════════════════════════════════════════════════════════════

  fpp.inventory:
    description: >
      Full inventory access - grants both fpp.inventory.cmd and
      fpp.inventory.rightclick automatically.
    default: op
    children:
      fpp.inventory.cmd:        true
      fpp.inventory.rightclick: true
      fpp.inventory.own:        true

  fpp.inventory.cmd:
    description: >
      Open a bot's inventory via /fpp inventory <bot> (or /fpp inv <bot>).
      Does not affect right-click behaviour.
    default: op

  fpp.inventory.rightclick:
    description: >
      Open a bot's inventory by right-clicking its entity in the world.
      Does not affect the /fpp inventory command.
    default: op

  fpp.inventory.own:
    description: Open inventory of bots you personally spawned. User-tier access.
    default: false

  # ════════════════════════════════════════════════════════════════════════════
  #  LEFT-CLICK / RIGHT-CLICK  (granular sub-nodes)
  # ════════════════════════════════════════════════════════════════════════════

  fpp.left-click:
    description: >
      Bot left-click automation (break blocks, attack entities) - grants
      fpp.left-click.start, fpp.left-click.once, fpp.left-click.repeat,
      fpp.left-click.hold, fpp.left-click.stop.
    default: op
    children:
      fpp.left-click.start:   true
      fpp.left-click.once:    true
      fpp.left-click.repeat:  true
      fpp.left-click.hold:    true
      fpp.left-click.stop:    true

  fpp.left-click.start:
    description: Start continuous left-click (/fpp left-click <bot>).
    default: op

  fpp.left-click.once:
    description: Single left-click (/fpp left-click <bot> --once).
    default: op

  fpp.left-click.repeat:
    description: Repeating left-click (/fpp left-click <bot> --repeat).
    default: op

  fpp.left-click.hold:
    description: Hold left-click (/fpp left-click <bot> --hold).
    default: op

  fpp.left-click.stop:
    description: Stop left-clicking (/fpp left-click <bot> --stop).
    default: op

  fpp.right-click:
    description: >
      Bot right-click automation (use items, interact) - grants
      fpp.right-click.start, fpp.right-click.once, fpp.right-click.repeat,
      fpp.right-click.hold, fpp.right-click.stop.
    default: op
    children:
      fpp.right-click.start:   true
      fpp.right-click.once:    true
      fpp.right-click.repeat:  true
      fpp.right-click.hold:    true
      fpp.right-click.stop:    true

  fpp.right-click.start:
    description: Start continuous right-click (/fpp right-click <bot>).
    default: op

  fpp.right-click.once:
    description: Single right-click (/fpp right-click <bot> --once).
    default: op

  fpp.right-click.repeat:
    description: Repeating right-click (/fpp right-click <bot> --repeat).
    default: op

  fpp.right-click.hold:
    description: Hold right-click (/fpp right-click <bot> --hold).
    default: op

  fpp.right-click.stop:
    description: Stop right-clicking (/fpp right-click <bot> --stop).
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  USE  (fpp.useitem = legacy;  fpp.use.cmd = new alias)
  # ════════════════════════════════════════════════════════════════════════════

  fpp.useitem:
    description: >
      Bot right-click automation - legacy node (still fully supported).
      Prefer fpp.use.cmd for new setups. Grants fpp.useitem.start/once/stop.
    default: op
    children:
      fpp.useitem.start: true
      fpp.useitem.once:  true
      fpp.useitem.stop:  true

  fpp.use.cmd:
    description: >
      New alias for fpp.useitem - bot right-click automation.
      Grants fpp.useitem automatically.
    default: op
    children:
      fpp.useitem: true

  fpp.useitem.start:
    description: Start continuous right-click (/fpp use <bot>).
    default: op

  fpp.useitem.once:
    description: Single right-click (/fpp use <bot> --once).
    default: op

  fpp.useitem.stop:
    description: Stop right-clicking (/fpp use <bot> --stop).
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  ATTACK
  # ════════════════════════════════════════════════════════════════════════════

  fpp.attack:
    description: >
      Bot attack swing automation. Automated PVE combat is configured per bot in the settings GUI.
    default: op

  fpp.perf:
    description: >
      Run /fpp perf diagnostics and trigger Spark profiler. Default: op.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  FIND
  # ════════════════════════════════════════════════════════════════════════════

  fpp.find:
    description: >
      Search for nearby blocks of a chosen type and mine them one by one.
      Supports --radius and --count flags.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  fpp.stop:
    description: Stop active core tasks (move/left-click/right-click/attack/find) for one or all bots.
    default: op

  fpp.setowner:
    description: Set the owner of a specific bot.
    default: op

  fpp.save:
    description: Save all active bot data immediately.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  STORAGE
  # ════════════════════════════════════════════════════════════════════════════

  fpp.storage:
    description: Register / manage bot supply containers with /fpp storage.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  SYSTEM / NETWORK
  # ════════════════════════════════════════════════════════════════════════════

  fpp.reload:
    description: Hot-reload plugin config with /fpp reload. Trusted admins only.
    default: op

  fpp.settings:
    description: Open the interactive settings GUI with /fpp settings.
    default: op

  fpp.check:
    description: Run system health check with /fpp check.
    default: op

  fpp.auth:
    description: >
      Manage bot auto-register/login against an installed login plugin with
      /fpp auth on|off|status|reset|setpassword. Default: op.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  BYPASS / NOTIFY
  # ════════════════════════════════════════════════════════════════════════════

  fpp.bypass.max:
    description: Bypass the global max-bots cap during /fpp spawn.
    default: op

  fpp.bypass.cooldown:
    description: Bypass the spawn cooldown delay for /fpp spawn. Grant to VIPs.
    default: op

  fpp.notify:
    description: >
      Receive update notifications on join when a newer FPP version is available.
      Automatically granted via fpp.op. Grant to non-OP staff explicitly.
    default: op

  # ════════════════════════════════════════════════════════════════════════════
  #  ECONOMY / RENTAL
  # ════════════════════════════════════════════════════════════════════════════

  fpp.rent:
    description: >
      Buy/extend a rented bot with real economy currency (/fpp rent buy,
      /fpp rent extend). Included in fpp.use - everyone can attempt it,
      gated by actually having the money and economy.enabled in config.yml.
    default: true

  fpp.rent.info:
    description: Check remaining rental time with /fpp rent info. Included in fpp.use.
    default: true

  fpp.rent.give:
    description: >
      Grant rental time to a player without charging them (/fpp rent give,
      /fpp rent clear) - the integration point for a custom shop plugin's own
      command-reward system, and for admin overrides. Console-usable.
    default: op

  fpp.rent.unlimited:
    description: This player's rented bots never expire from time running out.
    default: op
